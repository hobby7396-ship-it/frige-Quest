<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>冷蔵庫クエスト - Quest Kitchen</title>
  <!-- Chart.js for Radar Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pixel-width: 430px;
      --bg-main: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --accent-color: #00e5ff;
      --accent-gold: #ffb703;
      --accent-pink: #ff2a6d;
      --accent-green: #05ffa1;
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #05070a;
      color: var(--text-main);
      font-family: 'Zen Maru Gothic', sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: var(--pixel-width);
      min-height: 100vh;
      background-color: var(--bg-main);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
      padding-bottom: 50px;
    }

    @media (min-width: 450px) {
      .app-container {
        min-height: 95vh;
        margin: 20px 0;
        border-radius: 36px;
        border: 4px solid #21262d;
      }
    }

    .header-bar {
      padding: 16px 20px 12px;
      background: rgba(13, 17, 23, 0.98);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--card-border);
    }

    .user-profile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .level-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lvl-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-gold), #ff8800);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.85rem;
      color: #000;
      box-shadow: 0 0 12px rgba(255, 183, 3, 0.4);
      border: 2px solid #fff;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .rank-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .rank-sub {
      font-size: 0.65rem;
      color: var(--accent-color);
      letter-spacing: 0.5px;
    }

    .exp-container {
      text-align: right;
    }

    .exp-num {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent-green);
      margin-bottom: 2px;
    }

    .exp-bar-bg {
      width: 100%;
      height: 6px;
      background: #21262d;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .exp-bar-fill {
      height: 100%;
      width: 48%;
      background: linear-gradient(90deg, var(--accent-color), var(--accent-green));
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 20px 0;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      background: #161b22;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-sub);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: rgba(0, 229, 255, 0.12);
      border-color: var(--accent-color);
      color: var(--accent-color);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.15);
    }

    .main-content {
      padding: 16px 20px 0;
    }

    .cat-filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-chip {
      padding: 4px 10px;
      border-radius: 20px;
      background: #161b22;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      font-size: 0.7rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--card-border);
      color: #fff;
      border-color: var(--text-sub);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      margin-top: 6px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
    }

    .add-food-btn {
      background: rgba(5, 255, 161, 0.15);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 5px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-food-btn:active {
      transform: scale(0.96);
    }

    .ingredient-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .ingredient-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .ingredient-card.selected {
      border-color: var(--accent-color);
      background: rgba(0, 229, 255, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 229, 255, 0.25);
    }

    .ingredient-card.selected::after {
      content: '✓';
      position: absolute;
      top: 6px;
      left: 6px;
      width: 18px;
      height: 18px;
      background: var(--accent-color);
      color: #000;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      background: rgba(255, 42, 109, 0.85);
      color: #fff;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      z-index: 2;
      opacity: 0.75;
    }

    .ing-icon {
      font-size: 2.2rem;
      line-height: 1;
    }

    .ing-name {
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .ing-cat {
      font-size: 0.6rem;
      color: var(--text-sub);
    }

    .nutrition-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .nutrition-summary {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--card-border);
      line-height: 1.4;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 200px;
    }

    .action-panel {
      padding: 0 20px;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    .generate-btn {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      border: none;
      background: linear-gradient(135deg, var(--accent-gold), #ff8800);
      color: #000;
      font-size: 0.95rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(255, 183, 3, 0.4);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    .recipe-view {
      display: none;
      padding: 16px 20px 0;
    }

    .recipe-book-header {
      text-align: center;
      margin-bottom: 20px;
      padding: 14px;
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .recipe-book-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .recipe-card {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .recipe-img-wrapper {
      position: relative;
      width: 100%;
      height: 165px;
      background: #21262d;
      overflow: hidden;
    }

    .recipe-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-bottom: 1px solid var(--card-border);
      filter: brightness(0.95);
    }

    .recipe-body {
      padding: 16px;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .recipe-badge {
      display: inline-block;
      background: rgba(255, 42, 109, 0.2);
      border: 1px solid var(--accent-pink);
      color: var(--accent-pink);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 8px;
    }

    .recipe-badge.sub { 
      background: rgba(0, 229, 255, 0.12); 
      border-color: var(--accent-color); 
      color: var(--accent-color); 
    }
    
    .recipe-badge.soup { 
      background: rgba(5, 255, 161, 0.15); 
      border-color: var(--accent-green); 
      color: var(--accent-green); 
    }

    .recipe-badge.dessert { 
      background: rgba(255, 183, 3, 0.15); 
      border-color: var(--accent-gold); 
      color: var(--accent-gold); 
    }

    .method-tag {
      display: inline-block;
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid rgba(255, 183, 3, 0.5);
      color: var(--accent-gold);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
    }

    .recipe-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
      line-height: 1.4;
    }

    .recipe-ingredients {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--card-border);
    }

    .recipe-steps {
      font-size: 0.8rem;
      line-height: 1.6;
      color: #c9d1d9;
    }

    .reroll-panel {
      margin-top: 8px;
      margin-bottom: 24px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--accent-color);
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      background: #0d1117;
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: transparent;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-primary {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: var(--accent-green);
      color: #000;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- HEADER -->
  <div class="header-bar">
    <div class="user-profile">
      <div class="level-badge">
        <div class="lvl-circle" id="userLvlCircle">Lv.3</div>
        <div class="title-group">
          <span class="rank-title" id="userRankTitle">見習い料理勇者</span>
          <span class="rank-sub" id="userRankSub">RANK C • 献立マスター</span>
        </div>
      </div>
      <div class="exp-container">
        <div class="exp-num" id="expText">240 / 500 EXP</div>
      </div>
    </div>
    <div class="exp-bar-bg">
      <div class="exp-bar-fill" id="expBarFill"></div>
    </div>
  </div>

  <!-- NAVIGATION TABS -->
  <div class="nav-tabs">
    <div class="tab-btn active" id="tabSelect" onclick="switchTab('select')">食材チョイス</div>
    <div class="tab-btn" id="tabRecipe" onclick="switchTab('recipe')">完成献立 (おまかせ)</div>
  </div>

  <!-- SELECT VIEW -->
  <div id="selectView" class="main-content">
    <div class="cat-filter-bar">
      <button class="filter-chip active" onclick="filterCat('all', this)">すべて</button>
      <button class="filter-chip" onclick="filterCat('protein', this)">タンパク質</button>
      <button class="filter-chip" onclick="filterCat('vitamin', this)">ビタミン・野菜</button>
      <button class="filter-chip" onclick="filterCat('carbo', this)">主食・炭水化物</button>
    </div>

    <div class="section-header">
      <span class="section-title">📦 冷蔵庫の食材を選択</span>
      <button class="add-food-btn" onclick="openAddModal()">＋ 食材を追加</button>
    </div>

    <div class="ingredient-grid" id="ingredientGrid"></div>

    <div class="section-header">
      <span class="section-title">📊 リアルタイム栄養バランス</span>
    </div>
    <div class="nutrition-card">
      <div class="chart-container">
        <canvas id="nutritionChart"></canvas>
      </div>
      <div class="nutrition-summary" id="nutritionSummary">
        食材を選択すると、栄養バランスが自動計算されます。
      </div>
    </div>

    <!-- ACTION BUTTON -->
    <div class="action-panel">
      <button class="generate-btn" id="generateBtn" onclick="generateMenu()">
        <span>✨ 本日のクエスト献立をおまかせ生成</span>
      </button>
    </div>
  </div>

  <!-- RECIPE VIEW -->
  <div id="recipeView" class="recipe-view">
    <div class="recipe-book-header">
      <div class="recipe-book-title" id="genreTitle">✨ 本日のAIおまかせクエスト献立</div>
      <div style="font-size:0.75rem; color:var(--text-sub);" id="genreSub">冷蔵庫の食材から自動バランス編成</div>
    </div>
    <div id="recipeCardsContainer"></div>
    <div class="reroll-panel">
      <button class="generate-btn" onclick="generateMenu()">
        <span>🎲 別の調理法・献立で再生成する</span>
      </button>
    </div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <div class="modal-title">🥗 新しい食材を登録</div>
    <div class="input-group">
      <label class="input-label">食材名 (自動判定)</label>
      <input type="text" id="foodNameInput" class="input-field" placeholder="例: りんご, かまぼこ, 豚バラ" oninput="autoDetectAll(this.value)" onblur="autoDetectAll(this.value)">
    </div>
    <div class="input-group">
      <label class="input-label">絵文字アイコン</label>
      <input type="text" id="foodEmojiInput" class="input-field" value="🥗">
    </div>
    <div class="input-group">
      <label class="input-label">カテゴリー (PFC)</label>
      <select id="foodCatSelect" class="input-field">
        <option value="protein">タンパク質 (肉・魚・卵・豆・練り物・乳製品)</option>
        <option value="vitamin">ビタミン (野菜・きのこ・海藻・果物)</option>
        <option value="carbo">炭水化物 (芋・米・麺・パン・かぼちゃ)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAddModal()">キャンセル</button>
      <button class="btn-primary" onclick="addCustomIngredient()">追加する</button>
    </div>
  </div>
</div>

<script>
  const ingredientDB = {
    // 果物 (role: 'fruit')
    'りんご': { icon: '🍎', cat: 'vitamin', kana: 'りんご', role: 'fruit' },
    'リンゴ': { icon: '🍎', cat: 'vitamin', kana: 'りんご', role: 'fruit' },
    '林檎': { icon: '🍎', cat: 'vitamin', kana: 'りんご', role: 'fruit' },
    'みかん': { icon: '🍊', cat: 'vitamin', kana: 'みかん', role: 'fruit' },
    'オレンジ': { icon: '🍊', cat: 'vitamin', kana: 'おれんじ', role: 'fruit' },
    'バナナ': { icon: '🍌', cat: 'vitamin', kana: 'ばなな', role: 'fruit' },

    'ツナ': { icon: '🐟', cat: 'protein', kana: 'つな' },
    '豚肉': { icon: '🐷', cat: 'protein', kana: 'ぶたにく' },
    '豚バラ': { icon: '🐷', cat: 'protein', kana: 'ぶたばら' },
    '豚こま': { icon: '🐷', cat: 'protein', kana: 'ぶたこま' },
    '豚ロース': { icon: '🐷', cat: 'protein', kana: 'ぶたろーす' },
    '鶏肉': { icon: '🐔', cat: 'protein', kana: 'とりにく' },
    '鶏むね肉': { icon: '🐔', cat: 'protein', kana: 'とりむねにく' },

      try {
        defaultIngredients = JSON.parse(saved);
        defaultIngredients.forEach(item => {
          const info = ingredientDB[item.name];
          if (info) {
            item.kana = info.kana;
            if (item.name !== 'ブロッコリー' && item.icon === '🥦') {
              item.icon = info.icon;
            }
          }
        });
        saveData();
      } catch(e) {
        defaultIngredients = [...initialIngredients];
      }
    } else {
      defaultIngredients = [...initialIngredients];
    }

    const savedXP = localStorage.getItem('fridge_quest_xp');
    if (savedXP !== null) userXP = parseInt(savedXP, 10) || 240;
    const savedLvl = localStorage.getItem('fridge_quest_lvl');
    if (savedLvl !== null) userLvl = parseInt(savedLvl, 10) || 3;
    updateXPUI();
  }

  function saveData() {
    localStorage.setItem('fridge_quest_ingredients', JSON.stringify(defaultIngredients));
    localStorage.setItem('fridge_quest_xp', userXP.toString());
    localStorage.setItem('fridge_quest_lvl', userLvl.toString());
  }

  function renderGrid() {
    const grid = document.getElementById('ingredientGrid');
    if(!grid) return;
    grid.innerHTML = '';
    
    defaultIngredients.sort((a, b) => {
      const kanaA = a.kana || a.name;
      const kanaB = b.kana || b.name;
      return kanaA.localeCompare(kanaB, 'ja');
    });

    const filtered = defaultIngredients.filter(item => {
      if (currentFilter === 'all') return true;
      return item.cat === currentFilter;
    });

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = `ingredient-card ${item.selected ? 'selected' : ''}`;
      card.onclick = () => toggleSelect(item.id);

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.innerHTML = '✕';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        deleteIngredient(item.id);
      };

      card.innerHTML = `
        <div class="ing-icon">${item.icon}</div>
        <div class="ing-name">${item.name}</div>
        <div class="ing-cat">${getCatLabel(item.cat)}</div>
      `;
      card.appendChild(delBtn);
      grid.appendChild(card);
    });
    updateChart();
  }

  function filterCat(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  }

  function getCatLabel(cat) {
    if(cat==='protein') return 'タンパク質';
    if(cat==='vitamin') return 'ビタミン';
    return '炭水化物';
  }

  function toggleSelect(id) {
    const item = defaultIngredients.find(i => i.id === id);
    if(item) {
      item.selected = !item.selected;
      saveData();
      renderGrid();
    }
  }

  function deleteIngredient(id) {
    defaultIngredients = defaultIngredients.filter(i => i.id !== id);
    saveData();
    renderGrid();
  }

  function openAddModal() {
    document.getElementById('foodNameInput').value = '';
    document.getElementById('foodEmojiInput').value = '🥗';
    document.getElementById('foodCatSelect').value = 'vitamin';
    document.getElementById('addModal').style.display = 'flex';
  }

  function closeAddModal() {
    document.getElementById('addModal').style.display = 'none';
  }

  function autoDetectAll(val) {
    const trimmed = (val || '').trim();
    if (!trimmed) return;
    let matchedKey = Object.keys(ingredientDB)
      .sort((a, b) => b.length - a.length)
      .find(k => trimmed === k || trimmed.includes(k) || k.includes(trimmed));

    const emojiInput = document.getElementById('foodEmojiInput');
    const catSelect = document.getElementById('foodCatSelect');

    if (matchedKey && ingredientDB[matchedKey]) {
      emojiInput.value = ingredientDB[matchedKey].icon;
      catSelect.value = ingredientDB[matchedKey].cat;
      return;
    }

    if (/(かぼちゃ|カボチャ|南瓜|芋|いも|ポテト|米|飯|パン|麺|パスタ|うどん|そば|餅)/.test(trimmed)) {
      catSelect.value = 'carbo';
      if (/(かぼちゃ|カボチャ)/.test(trimmed)) emojiInput.value = '🎃';
      else if (/(パン)/.test(trimmed)) emojiInput.value = '🍞';
      else if (/(麺|うどん|そば|ラーメン)/.test(trimmed)) emojiInput.value = '🍜';
      else emojiInput.value = '🍚';
    } else if (/(豚|ポーク)/.test(trimmed)) {
      catSelect.value = 'protein';
      emojiInput.value = '🐷';
    } else if (/(鶏|チキン|ささみ)/.test(trimmed)) {
      catSelect.value = 'protein';
      emojiInput.value = '🐔';
    } else if (/(牛|ビーフ)/.test(trimmed)) {
      catSelect.value = 'protein';
      emojiInput.value = '🐮';
    } else if (/(ハム|ベーコン|ソーセージ|ウインナー)/.test(trimmed)) {
      catSelect.value = 'protein';
      emojiInput.value = '🥓';
    } else if (/(魚|鮭|サバ|マグロ|ツナ|エビ|イカ|タコ|ちくわ|かまぼこ)/.test(trimmed)) {
      catSelect.value = 'protein';
      emojiInput.value = '🐟';
    } else if (/(牛乳|豆腐|納豆|卵|肉|チーズ|ヨーグルト)/.test(trimmed)) {
      catSelect.value = 'protein';
      emojiInput.value = '🥩';
    } else if (/(りんご|リンゴ|林檎)/.test(trimmed)) {
      catSelect.value = 'vitamin';
      emojiInput.value = '🍎';
    } else if (/(みかん|オレンジ)/.test(trimmed)) {
      catSelect.value = 'vitamin';
      emojiInput.value = '🍊';
    } else if (/(バナナ)/.test(trimmed)) {
      catSelect.value = 'vitamin';
      emojiInput.value = '🍌';
    } else if (/(いちご|イチゴ)/.test(trimmed)) {
      catSelect.value = 'vitamin';
      emojiInput.value = '🍓';
    } else {
      catSelect.value = 'vitamin';
      emojiInput.value = '🥗';
    }
  }

  function addCustomIngredient() {
    const nameInput = document.getElementById('foodNameInput');
    autoDetectAll(nameInput.value);
    const name = nameInput.value.trim();
    const icon = document.getElementById('foodEmojiInput').value.trim() || '🥗';
    const cat = document.getElementById('foodCatSelect').value;
    if(!name) return;

    const matched = Object.keys(ingredientDB).find(k => k === name || name.includes(k));
    const kana = (matched && ingredientDB[matched].kana) ? ingredientDB[matched].kana : name;

    defaultIngredients.push({
      id: Date.now().toString(),
      name, kana, icon, cat, selected: true
    });
    saveData();
    nameInput.value = '';
    closeAddModal();
    renderGrid();
  }

  function initChart() {
    const canvas = document.getElementById('nutritionChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['タンパク質', '脂質', '炭水化物', 'ビタミン', '食物繊維'],
        datasets: [{
          data: [10, 10, 10, 10, 10],
          backgroundColor: 'rgba(0, 229, 255, 0.25)',
          borderColor: '#00e5ff',
          pointBackgroundColor: '#05ffa1',
          pointBorderColor: '#fff',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            angleLines: { color: 'rgba(255, 255, 255, 0.15)' },
            grid: { color: 'rgba(255, 255, 255, 0.15)' },
            pointLabels: { color: '#f0f6fc', font: { size: 10, family: 'Zen Maru Gothic', weight: 'bold' } },
            ticks: { display: false },
            suggestedMin: 0, suggestedMax: 100
          }
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  function updateChart() {
    if (!chartInstance) return;
    const selected = defaultIngredients.filter(i => i.selected);
    if (selected.length === 0) {
      chartInstance.data.datasets[0].data = [10, 10, 10, 10, 10];
      chartInstance.update();
      document.getElementById('nutritionSummary').innerHTML = '💡 <b>食材を選択してください</b>';
      return;
    }
    let p = 15, f = 15, c = 15, v = 15, fib = 15;
    selected.forEach(s => {
      if(s.cat === 'protein') { p += 25; f += 15; }
      if(s.cat === 'vitamin') { v += 30; fib += 25; }
      if(s.cat === 'carbo') { c += 35; f += 5; }
    });
    chartInstance.data.datasets[0].data = [Math.min(p, 100), Math.min(f, 100), Math.min(c, 100), Math.min(v, 100), Math.min(fib, 100)];
    chartInstance.update();
    document.getElementById('nutritionSummary').innerHTML = `💡 <b>選択中 (${selected.length}品):</b> 栄養バランス自動計算完了！`;
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if(tab==='select') {
      document.getElementById('tabSelect').classList.add('active');
      document.getElementById('selectView').style.display = 'block';
      document.getElementById('recipeView').style.display = 'none';
      setTimeout(() => updateChart(), 50);
    } else {
      document.getElementById('tabRecipe').classList.add('active');
      document.getElementById('selectView').style.display = 'none';
      document.getElementById('recipeView').style.display = 'block';
    }
  }

  function addXP(amount) {
    userXP += amount;
    if (userXP >= userMaxXP) { userLvl += 1; userXP = userXP - userMaxXP; }
    saveData();
    updateXPUI();
  }

  function updateXPUI() {
    document.getElementById('userLvlCircle').innerText = `Lv.${userLvl}`;
    const percent = Math.min((userXP / userMaxXP) * 100, 100);
    document.getElementById('expBarFill').style.width = `${percent}%`;
    document.getElementById('expText').innerText = `${userXP} / ${userMaxXP} EXP`;
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // 料理の常識（相性ルール）判定ヘルパー
  function getIngredientRole(item) {
    if (item.role) return item.role;
    const dbInfo = ingredientDB[item.name];
    if (dbInfo && dbInfo.role) return dbInfo.role;
    if (/(りんご|リンゴ|林檎|みかん|オレンジ|バナナ|いちご|イチゴ|ぶどう|キウイ|もも|梨|メロン|スイカ)/.test(item.name)) {
      return 'fruit';
    }
    if (/(納豆|かまぼこ|カマボコ|ちくわ|カニカマ|しらす|じゃこ|ヨーグルト)/.test(item.name)) {
      return 'ready';
    }
    return 'normal';
  }

  function generateMenu() {
    const selected = defaultIngredients.filter(i => i.selected);

    // 1. 相性ルールに基づき「果物」「そのまま/小鉢向き食材」「通常調理食材」に自動仕分け
    const fruits = selected.filter(i => getIngredientRole(i) === 'fruit');
    const readyItems = selected.filter(i => getIngredientRole(i) === 'ready');
    const normalSelected = selected.filter(i => getIngredientRole(i) === 'normal');

    const cookProteins = normalSelected.filter(i => i.cat === 'protein');
    const cookVitamins = normalSelected.filter(i => i.cat === 'vitamin');
    const cookCarbos = normalSelected.filter(i => i.cat === 'carbo');

    const genres = ['和食', '洋食', '中華'];
    let chosenGenre = pickRandom(genres);
    let genreData = recipeDatabase[chosenGenre];
    let mainRecipe = pickRandom(genreData.mains);

    let comboKey = `${chosenGenre}-${mainRecipe.method}`;
    if (comboKey === lastComboKey) {
      chosenGenre = pickRandom(genres);
      genreData = recipeDatabase[chosenGenre];
      mainRecipe = pickRandom(genreData.mains);
      comboKey = `${chosenGenre}-${mainRecipe.method}`;
    }
    lastComboKey = comboKey;

    const subRecipe = pickRandom(genreData.subs);
    const soupRecipe = pickRandom(genreData.soups);

    // 主菜：加熱調理向きタンパク質優先
    const mainIngList = cookProteins.length > 0
      ? cookProteins.map(i => i.name)
      : (cookCarbos.length > 0 ? cookCarbos.map(i => i.name) : (readyItems.length > 0 ? readyItems.map(i => i.name) : ['おまかせメイン食材']));
    const mainTitleIng = mainIngList.slice(0, 2).join('と');
    const mainUseIng = mainIngList.join('・');

    // 副菜：野菜＋納豆・ちくわ・かまぼこ等
    const subPool = [...cookVitamins.slice(0, 2), ...readyItems.slice(0, 1)];
    const subIngList = subPool.length > 0 ? subPool.map(i => i.name) : ['旬の野菜'];
    const subTitleIng = subIngList.slice(0, 2).join('と');
    const subUseIng = subIngList.join('・');

    // 汁物：炭水化物（ごはん・パン等）や果物は絶対に混ぜず、野菜・タンパク質・豆腐などを割り当て
    const soupPool = [
      ...cookVitamins.slice(2),
      ...readyItems.slice(1),
      ...(cookProteins.length > 0 ? cookProteins.slice(-1) : [])
    ];
    const soupIngList = soupPool.length > 0 ? soupPool.map(i => i.name) : ['豆腐・ねぎ'];
    const soupTitleIng = soupIngList.slice(0, 2).join('と');
    const soupUseIng = soupIngList.join('・');

    document.getElementById('genreTitle').innerText = `✨ 本日の献立ヒント ${genreData.badgeTitle}`;
    document.getElementById('genreSub').innerText = genreData.subText;

    addXP(120);

    // 果物が選ばれていた場合は、料理に混ぜずに「食後のフルーツ・デザート枠」カードを追加
    let fruitCardHtml = '';
    if (fruits.length > 0) {
      const fruitNames = fruits.map(i => i.name).join('・');
      const fruitIdeas = [
        {
          method: '🔪 カット・生食',
          title: `${fruitNames}のフレッシュ食後デザート`,
          step: '1. 食べやすい大きさにカットして器に盛り付けます。<br>2. 塩水やレモン汁を軽くくぐらせると変色を防いで瑞々しく楽しめます。'
        },
        {
          method: '🍯 アレンジ',
          title: `${fruitNames}のヨーグルト・はちみつ添え`,
          step: '1. 一口大に切ったフルーツを器に盛ります。<br>2. お好みでヨーグルトやはちみつ、シナモンをひと振りするとカフェ風の一品に。'
        }
      ];
      const chosenFruitIdea = pickRandom(fruitIdeas);
      fruitCardHtml = `
        <div class="recipe-card">
          <div class="recipe-img-wrapper">
            <img class="recipe-img" src="${IMG.fruit}" alt="デザート">
          </div>
          <div class="recipe-body">
            <div class="badge-row">
              <span class="recipe-badge dessert">デザート (食後)</span>
              <span class="method-tag">${chosenFruitIdea.method}</span>
            </div>
            <div class="recipe-title">${chosenFruitIdea.title}</div>
            <div class="recipe-ingredients">使用食材: ${fruitNames}</div>
            <div class="recipe-steps">${chosenFruitIdea.step}</div>
          </div>
        </div>
      `;
    }

    const container = document.getElementById('recipeCardsContainer');
    container.innerHTML = `
      <div class="recipe-card">
        <div class="recipe-img-wrapper">
          <img class="recipe-img" src="${mainRecipe.img}" alt="主菜">
        </div>
        <div class="recipe-body">
          <div class="badge-row">
            <span class="recipe-badge">主菜 (メイン)</span>
            <span class="method-tag">${mainRecipe.method}</span>
          </div>
          <div class="recipe-title">${mainRecipe.title(mainTitleIng)}</div>
          <div class="recipe-ingredients">使用食材: ${mainUseIng}</div>
          <div class="recipe-steps">${mainRecipe.step}</div>
        </div>
      </div>
      <div class="recipe-card">
        <div class="recipe-img-wrapper">
          <img class="recipe-img" src="${subRecipe.img}" alt="副菜">
        </div>
        <div class="recipe-body">
          <div class="badge-row">
            <span class="recipe-badge sub">副菜 (サブ)</span>
            <span class="method-tag">${subRecipe.method}</span>
          </div>
          <div class="recipe-title">${subRecipe.title(subTitleIng)}</div>
          <div class="recipe-ingredients">使用食材: ${subUseIng}</div>
          <div class="recipe-steps">${subRecipe.step}</div>
        </div>
      </div>
      <div class="recipe-card">
        <div class="recipe-img-wrapper">
          <img class="recipe-img" src="${soupRecipe.img}" alt="汁物">
        </div>
        <div class="recipe-body">
          <div class="badge-row">
            <span class="recipe-badge soup">汁物 (スープ)</span>
            <span class="method-tag">${soupRecipe.method}</span>
          </div>
          <div class="recipe-title">${soupRecipe.title(soupTitleIng)}</div>
          <div class="recipe-ingredients">使用食材: ${soupUseIng}</div>
          <div class="recipe-steps">${soupRecipe.step}</div>
        </div>
      </div>
      ${fruitCardHtml}
    `;
    switchTab('recipe');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.onload = () => {
    loadData();
    initChart();
    renderGrid();
  };
</script>
</body>
</html>
