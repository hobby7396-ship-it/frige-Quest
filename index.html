<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>冷蔵庫クエスト - Quest Kitchen</title>
  <!-- Chart.js for Radar Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pixel-width: 430px;
      --bg-main: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --accent-color: #00e5ff;
      --accent-gold: #ffb703;
      --accent-pink: #ff2a6d;
      --accent-green: #05ffa1;
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #05070a;
      color: var(--text-main);
      font-family: 'Zen Maru Gothic', sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: var(--pixel-width);
      min-height: 100vh;
      background-color: var(--bg-main);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
      padding-bottom: 50px;
    }

    @media (min-width: 450px) {
      .app-container {
        min-height: 95vh;
        margin: 20px 0;
        border-radius: 36px;
        border: 4px solid #21262d;
      }
    }

    .header-bar {
      padding: 16px 20px 12px;
      background: rgba(13, 17, 23, 0.98);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--card-border);
    }

    .user-profile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .level-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lvl-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-gold), #ff8800);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.85rem;
      color: #000;
      box-shadow: 0 0 12px rgba(255, 183, 3, 0.4);
      border: 2px solid #fff;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .rank-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .rank-sub {
      font-size: 0.65rem;
      color: var(--accent-color);
      letter-spacing: 0.5px;
    }

    .exp-container {
      text-align: right;
    }

    .exp-num {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent-green);
      margin-bottom: 2px;
    }

    .exp-bar-bg {
      width: 100%;
      height: 6px;
      background: #21262d;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .exp-bar-fill {
      height: 100%;
      width: 48%;
      background: linear-gradient(90deg, var(--accent-color), var(--accent-green));
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 20px 0;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      background: #161b22;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-sub);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: rgba(0, 229, 255, 0.12);
      border-color: var(--accent-color);
      color: var(--accent-color);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.15);
    }

    .main-content {
      padding: 16px 20px 0;
    }

    .cat-filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-chip {
      padding: 4px 10px;
      border-radius: 20px;
      background: #161b22;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      font-size: 0.7rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--card-border);
      color: #fff;
      border-color: var(--text-sub);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      margin-top: 6px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
    }

    .add-food-btn {
      background: rgba(5, 255, 161, 0.15);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 5px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .add-food-btn:active {
      transform: scale(0.96);
    }

    .ingredient-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .ingredient-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .ingredient-card.selected {
      border-color: var(--accent-color);
      background: rgba(0, 229, 255, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 229, 255, 0.25);
    }

    .ingredient-card.selected::after {
      content: '✓';
      position: absolute;
      top: 6px;
      left: 6px;
      width: 18px;
      height: 18px;
      background: var(--accent-color);
      color: #000;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      background: rgba(255, 42, 109, 0.85);
      color: #fff;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      z-index: 2;
      opacity: 0.75;
    }

    .ing-icon {
      font-size: 2.2rem;
      line-height: 1;
    }

    .ing-name {
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .ing-cat {
      font-size: 0.6rem;
      color: var(--text-sub);
    }

    .nutrition-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .nutrition-summary {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--card-border);
      line-height: 1.4;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 200px;
    }

    .action-panel {
      padding: 0 20px;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    .generate-btn {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      border: none;
      background: linear-gradient(135deg, var(--accent-gold), #ff8800);
      color: #000;
      font-size: 0.95rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(255, 183, 3, 0.4);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    .recipe-view {
      display: none;
      padding: 16px 20px 0;
    }

    .recipe-book-header {
      text-align: center;
      margin-bottom: 20px;
      padding: 14px;
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .recipe-book-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    /* ダークな統一世界観のレシピカード */
    .recipe-card {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .recipe-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-bottom: 1px solid var(--card-border);
      filter: brightness(0.95);
    }

    .recipe-body {
      padding: 16px;
    }

    .recipe-badge {
      display: inline-block;
      background: rgba(255, 42, 109, 0.2);
      border: 1px solid var(--accent-pink);
      color: var(--accent-pink);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .recipe-badge.sub { 
      background: rgba(0, 229, 255, 0.12); 
      border-color: var(--accent-color); 
      color: var(--accent-color); 
    }
    
    .recipe-badge.soup { 
      background: rgba(5, 255, 161, 0.15); 
      border-color: var(--accent-green); 
      color: var(--accent-green); 
    }

    .recipe-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
      line-height: 1.4;
    }

    .recipe-ingredients {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--card-border);
    }

    .recipe-steps {
      font-size: 0.8rem;
      line-height: 1.6;
      color: #c9d1d9;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--accent-color);
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }

    .input-field {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      background: #0d1117;
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: transparent;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-primary {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: var(--accent-green);
      color: #000;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- HEADER -->
  <div class="header-bar">
    <div class="user-profile">
      <div class="level-badge">
        <div class="lvl-circle" id="userLvlCircle">Lv.3</div>
        <div class="title-group">
          <span class="rank-title" id="userRankTitle">見習い料理勇者</span>
          <span class="rank-sub" id="userRankSub">RANK C • 献立マスター</span>
        </div>
      </div>
      <div class="exp-container">
        <div class="exp-num" id="expText">240 / 500 EXP</div>
      </div>
    </div>
    <div class="exp-bar-bg">
      <div class="exp-bar-fill" id="expBarFill"></div>
    </div>
  </div>

  <!-- NAVIGATION TABS -->
  <div class="nav-tabs">
    <div class="tab-btn active" id="tabSelect" onclick="switchTab('select')">食材チョイス</div>
    <div class="tab-btn" id="tabRecipe" onclick="switchTab('recipe')">完成献立 (おまかせ)</div>
  </div>

  <!-- SELECT VIEW -->
  <div id="selectView" class="main-content">
    <div class="cat-filter-bar">
      <button class="filter-chip active" onclick="filterCat('all', this)">すべて</button>
      <button class="filter-chip" onclick="filterCat('protein', this)">タンパク質</button>
      <button class="filter-chip" onclick="filterCat('vitamin', this)">ビタミン・野菜</button>
      <button class="filter-chip" onclick="filterCat('carbo', this)">主食・炭水化物</button>
    </div>

    <div class="section-header">
      <span class="section-title">📦 冷蔵庫の食材を選択</span>
      <button class="add-food-btn" onclick="openAddModal()">＋ 食材を追加</button>
    </div>

    <div class="ingredient-grid" id="ingredientGrid"></div>

    <div class="section-header">
      <span class="section-title">📊 リアルタイム栄養バランス</span>
    </div>
    <div class="nutrition-card">
      <div class="chart-container">
        <canvas id="nutritionChart"></canvas>
      </div>
      <div class="nutrition-summary" id="nutritionSummary">
        食材を選択すると、栄養バランスが自動計算されます。
      </div>
    </div>

    <!-- ACTION BUTTON -->
    <div class="action-panel">
      <button class="generate-btn" id="generateBtn" onclick="generateMenu()">
        <span>✨ 本日のクエスト献立をおまかせ生成</span>
      </button>
    </div>
  </div>

  <!-- RECIPE VIEW -->
  <div id="recipeView" class="recipe-view">
    <div class="recipe-book-header">
      <div class="recipe-book-title" id="genreTitle">✨ 本日のAIおまかせクエスト献立</div>
      <div style="font-size:0.75rem; color:var(--text-sub);" id="genreSub">冷蔵庫の食材から自動バランス編成</div>
    </div>
    <div id="recipeCardsContainer"></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <div class="modal-title">🥗 新しい食材を登録</div>
    <div class="input-group">
      <label class="input-label">食材名 (自動判定)</label>
      <input type="text" id="foodNameInput" class="input-field" placeholder="例: かまぼこ, 豚バラ, ピーマン" oninput="autoDetectAll(this.value)" onblur="autoDetectAll(this.value)">
    </div>
    <div class="input-group">
      <label class="input-label">絵文字アイコン</label>
      <input type="text" id="foodEmojiInput" class="input-field" value="🥦">
    </div>
    <div class="input-group">
      <label class="input-label">カテゴリー (PFC)</label>
      <select id="foodCatSelect" class="input-field">
        <option value="protein">タンパク質 (肉・魚・卵・豆・練り物・乳製品)</option>
        <option value="vitamin">ビタミン (野菜・きのこ・海藻・果物)</option>
        <option value="carbo">炭水化物 (芋・米・麺・パン・かぼちゃ)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAddModal()">キャンセル</button>
      <button class="btn-primary" onclick="addCustomIngredient()">追加する</button>
    </div>
  </div>
</div>

    'もやし': { icon: '🌱', cat: 'vitamin', kana: 'もやし' },
    'ねぎ': { icon: '🧅', cat: 'vitamin', kana: 'ねぎ' },
    '玉ねぎ': { icon: '🧅', cat: 'vitamin', kana: 'たまねぎ' },
    'にんじん': { icon: '🥕', cat: 'vitamin', kana: 'にんじん' },
    '大根': { icon: '🤍', cat: 'vitamin', kana: 'だいこん' },
    'トマト': { icon: '🍅', cat: 'vitamin', kana: 'とまと' },
    'ブロッコリー': { icon: '🥦', cat: 'vitamin', kana: 'ぶろっこりー' },
    'きゅうり': { icon: '🥒', cat: 'vitamin', kana: 'きゅうり' },
    'なす': { icon: '🍆', cat: 'vitamin', kana: 'なす' },
    'ナス': { icon: '🍆', cat: 'vitamin', kana: 'なす' },
    'ピーマン': { icon: '🫑', cat: 'vitamin', kana: 'ぴーまん' },
    'しめじ': { icon: '🍄', cat: 'vitamin', kana: 'しめじ' },
    'えのき': { icon: '🍄', cat: 'vitamin', kana: 'えのき' },
    'しいたけ': { icon: '🍄', cat: 'vitamin', kana: 'しいたけ' },
    'わかめ': { icon: '🌿', cat: 'vitamin', kana: 'わかめ' },
    'かぼちゃ': { icon: '🎃', cat: 'carbo', kana: 'かぼちゃ' },
    'じゃがいも': { icon: '🥔', cat: 'carbo', kana: 'じゃがいも' },
    'さつまいも': { icon: '🍠', cat: 'carbo', kana: 'さつまいも' },
    '米': { icon: '🍚', cat: 'carbo', kana: 'こめ' },
    'ごはん': { icon: '🍚', cat: 'carbo', kana: 'ごはん' },
    '食パン': { icon: '🍞', cat: 'carbo', kana: 'しょくぱん' },
    'うどん': { icon: '🍜', cat: 'carbo', kana: 'うどん' },
    '中華麺': { icon: '🍜', cat: 'carbo', kana: 'ちゅうかめん' },
    'パスタ': { icon: '🍝', cat: 'carbo', kana: 'ぱすた' }
  };

  const initialIngredients = [
    { id: '1', name: '鶏むね肉', kana: 'とりむねにく', cat: 'protein', icon: '🐔', selected: true },
    { id: '2', name: '豚肉', kana: 'ぶたにく', cat: 'protein', icon: '🐷', selected: false },
    { id: '3', name: '生鮭', kana: 'なまざけ', cat: 'protein', icon: '🐟', selected: false },
    { id: '4', name: '卵', kana: 'たまご', cat: 'protein', icon: '🥚', selected: true },
    { id: '5', name: '絹豆腐', kana: 'きぬどうふ', cat: 'protein', icon: '🧊', selected: false },
    { id: '6', name: 'ブロッコリー', kana: 'ぶろっこりー', cat: 'vitamin', icon: '🥦', selected: true },
    { id: '7', name: 'ほうれん草', kana: 'ほうれんそう', cat: 'vitamin', icon: '🥬', selected: false },
    { id: '8', name: 'にんじん', kana: 'にんじん', cat: 'vitamin', icon: '🥕', selected: true },
    { id: '9', name: '玉ねぎ', kana: 'たまねぎ', cat: 'vitamin', icon: '🧅', selected: false },
    { id: '10', name: 'じゃがいも', kana: 'じゃがいも', cat: 'carbo', icon: '🥔', selected: false }
  ];

  let defaultIngredients = [];
  let userXP = 240;
  let userMaxXP = 500;
  let userLvl = 3;
  let currentFilter = 'all';
  let chartInstance = null;

  function loadData() {
    const saved = localStorage.getItem('fridge_quest_ingredients');
    if (saved) {
      try { defaultIngredients = JSON.parse(saved); } catch(e) { defaultIngredients = [...initialIngredients]; }
    } else {
      defaultIngredients = [...initialIngredients];
    }
    const savedXP = localStorage.getItem('fridge_quest_xp');
    if (savedXP !== null) userXP = parseInt(savedXP, 10) || 240;
    const savedLvl = localStorage.getItem('fridge_quest_lvl');
    if (savedLvl !== null) userLvl = parseInt(savedLvl, 10) || 3;
    updateXPUI();
  }

  function saveData() {
    localStorage.setItem('fridge_quest_ingredients', JSON.stringify(defaultIngredients));
    localStorage.setItem('fridge_quest_xp', userXP.toString());
    localStorage.setItem('fridge_quest_lvl', userLvl.toString());
  }

  function renderGrid() {
    const grid = document.getElementById('ingredientGrid');
    if(!grid) return;
    grid.innerHTML = '';
    
    defaultIngredients.sort((a, b) => {
      const kanaA = a.kana || a.name;
      const kanaB = b.kana || b.name;
      return kanaA.localeCompare(kanaB, 'ja');
    });

    const filtered = defaultIngredients.filter(item => {
      if (currentFilter === 'all') return true;
      return item.cat === currentFilter;
    });

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = `ingredient-card ${item.selected ? 'selected' : ''}`;
      card.onclick = () => toggleSelect(item.id);

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.innerHTML = '✕';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        deleteIngredient(item.id);
      };

      card.innerHTML = `
        <div class="ing-icon">${item.icon}</div>
        <div class="ing-name">${item.name}</div>
        <div class="ing-cat">${getCatLabel(item.cat)}</div>
      `;
      card.appendChild(delBtn);
      grid.appendChild(card);
    });
    updateChart();
  }

  function filterCat(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  }

  function getCatLabel(cat) {
    if(cat==='protein') return 'タンパク質';
    if(cat==='vitamin') return 'ビタミン';
    return '炭水化物';
  }

  function toggleSelect(id) {
    const item = defaultIngredients.find(i => i.id === id);
    if(item) {
      item.selected = !item.selected;
      saveData();
      renderGrid();
    }
  }

  function deleteIngredient(id) {
    defaultIngredients = defaultIngredients.filter(i => i.id !== id);
    saveData();
    renderGrid();
  }

  function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
  function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

  function autoDetectAll(val) {
    const trimmed = (val || '').trim();
    if (!trimmed) return;
    let matchedKey = Object.keys(ingredientDB).sort((a, b) => b.length - a.length).find(k => trimmed === k || trimmed.includes(k));
    const emojiInput = document.getElementById('foodEmojiInput');
    const catSelect = document.getElementById('foodCatSelect');
    if (matchedKey && ingredientDB[matchedKey]) {
      emojiInput.value = ingredientDB[matchedKey].icon;
      catSelect.value = ingredientDB[matchedKey].cat;
      return;
    }
    if (/(かまぼこ|肉|魚|卵|豆腐|ウインナー|ベーコン|ハム|えび|いか|たこ)/.test(trimmed)) {
      catSelect.value = 'protein';
      emojiInput.value = '🥩';
    } else if (/(米|パン|うどん|麺|パスタ|芋|かぼちゃ|餅)/.test(trimmed)) {
      catSelect.value = 'carbo';
      emojiInput.value = '🍚';
    } else {
      catSelect.value = 'vitamin';
      emojiInput.value = '🥦';
    }
  }

  function addCustomIngredient() {
    const nameInput = document.getElementById('foodNameInput');
    autoDetectAll(nameInput.value);
    const name = nameInput.value.trim();
    const icon = document.getElementById('foodEmojiInput').value.trim() || '🥗';
    const cat = document.getElementById('foodCatSelect').value;
    if(!name) return;
    defaultIngredients.push({ id: Date.now().toString(), name, kana: name, icon, cat, selected: true });
    saveData();
    nameInput.value = '';
    closeAddModal();
    renderGrid();
  }

  function initChart() {
    const canvas = document.getElementById('nutritionChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['タンパク質', '脂質', '炭水化物', 'ビタミン', '食物繊維'],
        datasets: [{
          data: [10, 10, 10, 10, 10],
          backgroundColor: 'rgba(0, 229, 255, 0.25)',
          borderColor: '#00e5ff',
          pointBackgroundColor: '#05ffa1',
          pointBorderColor: '#fff',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            angleLines: { color: 'rgba(255, 255, 255, 0.15)' },
            grid: { color: 'rgba(255, 255, 255, 0.15)' },
            pointLabels: { color: '#f0f6fc', font: { size: 10, family: 'Zen Maru Gothic', weight: 'bold' } },
            ticks: { display: false },
            suggestedMin: 0, suggestedMax: 100
          }
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  function updateChart() {
    if (!chartInstance) return;
    const selected = defaultIngredients.filter(i => i.selected);
    if (selected.length === 0) {
      chartInstance.data.datasets[0].data = [10, 10, 10, 10, 10];
      chartInstance.update();
      document.getElementById('nutritionSummary').innerHTML = '💡 <b>食材を選択してください</b>';
      return;
    }
    let p = 15, f = 15, c = 15, v = 15, fib = 15;
    selected.forEach(s => {
      if(s.cat === 'protein') { p += 25; f += 15; }
      if(s.cat === 'vitamin') { v += 30; fib += 25; }
      if(s.cat === 'carbo') { c += 35; f += 5; }
    });
    chartInstance.data.datasets[0].data = [Math.min(p, 100), Math.min(f, 100), Math.min(c, 100), Math.min(v, 100), Math.min(fib, 100)];
    chartInstance.update();
    document.getElementById('nutritionSummary').innerHTML = `💡 <b>選択中 (${selected.length}品):</b> 栄養バランス自動計算完了！`;
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if(tab==='select') {
      document.getElementById('tabSelect').classList.add('active');
      document.getElementById('selectView').style.display = 'block';
      document.getElementById('recipeView').style.display = 'none';
      setTimeout(() => updateChart(), 50);
    } else {
      document.getElementById('tabRecipe').classList.add('active');
      document.getElementById('selectView').style.display = 'none';
      document.getElementById('recipeView').style.display = 'block';
    }
  }

  function addXP(amount) {
    userXP += amount;
    if (userXP >= userMaxXP) { userLvl += 1; userXP = userXP - userMaxXP; }
    saveData();
    updateXPUI();
  }

  function updateXPUI() {
    document.getElementById('userLvlCircle').innerText = `Lv.${userLvl}`;
    const percent = Math.min((userXP / userMaxXP) * 100, 100);
    document.getElementById('expBarFill').style.width = `${percent}%`;
    document.getElementById('expText').innerText = `${userXP} / ${userMaxXP} EXP`;
  }

  // おまかせロジック（和・洋・中自動判定 ＆ 主菜・副菜・汁物振り分け）
  function generateMenu() {
    const selected = defaultIngredients.filter(i => i.selected);
    const proteins = selected.filter(i => i.cat === 'protein');
    const vitamins = selected.filter(i => i.cat === 'vitamin');
    const carbos = selected.filter(i => i.cat === 'carbo');

    // ジャンルをランダムに決定 (和・洋・中)
    const genres = ['和食', '洋食', '中華'];
    const chosenGenre = genres[Math.floor(Math.random() * genres.length)];

    // メイン・サブ・スープの食材割り振りの抽出
    const mainProt = proteins.length > 0 ? proteins.map(i=>i.name).join('・') : 'おまかせメイン食材';
    const subVitamins = vitamins.length > 0 ? vitamins.slice(0, 2).map(i=>i.name).join('と') : '旬の野菜';
    const soupItems = vitamins.length > 1 ? vitamins.slice(2).map(i=>i.name).join('・') : (carbos.length > 0 ? carbos[0].name : '豆腐・ねぎ');

    let mainImg, subImg, soupImg;

    let mainStep, subStep, soupStep;

      subTitle = `${subVitamins}のさっぱりおひたし・小鉢`;
      subStep = '1. 野菜をサッと茹でて水気を絞ります。<br>2. 醤油とめんつゆ、かつお節で和えます。';

      soupImg = 'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80';
      soupTitle = 'ほっこり温まる手作りお味噌汁';
      soupStep = '1. お鍋にお水と出汁、お好みの具材を入れて火を通します。<br>2. 味噌を溶き入れて完成です。';

    } else if (chosenGenre === '洋食') {
      document.getElementById('genreTitle').innerText = '✨ 本日のAIおまかせクエスト献立 【洋食ディナー】';
      document.getElementById('genreSub').innerText = '香ばしい香りが広がる洋風バランスコース';

      mainImg = 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80';
      mainTitle = '香ばしハーブのジューシーソテー';
      mainStep = '1. 食材に塩コショウとニンニクをすり込みます。<br>2. オリーブオイルでこんがり焼き上げ、バターで風味をつけます。';

      subImg = 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=800&q=80';
      subTitle = `${subVitamins}のフレッシュサラダ`;
      subStep = '1. 野菜を一口大にカットし、冷水でシャキッとさせます。<br>2. お好みのドレッシングで和えます。';

      soupImg = 'https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800&q=80';
      soupTitle = 'なめらかコンソメスープ';

    } else {
      document.getElementById('genreTitle').innerText = '✨ 本日のAIおまかせクエスト献立 【本格中華】';
      document.getElementById('genreSub').innerText = '食欲そそるスピード中華コース';

      mainImg = 'https://images.unsplash.com/photo-1525755662778-989d0524087e?auto=format&fit=crop&w=800&q=80';
      mainTitle = '旨味凝縮！シャキッと強火炒め';

  window.onload = () => {
    loadData();
    initChart();
    renderGrid();
  };
</script>
